// ============================================================
// PlayBall ActiveRole 参数配置
// ============================================================

// 射门和传球决策参数
alwaysShoot = false;              // 是否总是射门（禁用传球）
shootThreshold = 0.8;             // 射门阈值（超过此值不考虑传球）

// 传球距离参数
passDistanceSameTargetHysteresis = 300.0;  // 同一目标的距离容差（mm）
minPassDistanceIndirectKick = 1000.0;      // 间接任意球最小传球距离（mm）
minPassDistance = 1500.0;                  // 正常比赛最小传球距离（mm）
maxPassDistance = 4500.0;                  // 正常比赛最大传球距离（mm）
maxFreeKickDistance = 6000.0;              // 任意球最大传球距离（mm）
maxGoalKickDistance = 9000.0;              // 球门球最大传球距离（mm）

// 传球链参数
maxSearchDepth = 1;                        // 最大传球链深度
discountFactor = 0.9;                      // 传球链折扣因子

// 决策惩罚参数
minPenalty = 0.1;                          // 最小惩罚值
maxPenalty = 0.8;                          // 最大惩罚值
ballDistMinPenalty = 300.0;                // 应用最小惩罚的球距离（mm）
ballDistMaxPenalty = 200.0;                // 应用最大惩罚的球距离（mm）

// 其他参数
minRating = 0.01;                          // 最小评分
clearDribbleHysteresisValue = 0.05;        // 清球/运球切换滞后值
